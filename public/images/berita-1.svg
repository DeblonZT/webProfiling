<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="50%" stop-color="#14213d" />
      <stop offset="100%" stop-color="#070c17" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03A9F4" />
      <stop offset="100%" stop-color="#026E9F" />
    </linearGradient>
    <pattern id="gridPattern1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#03A9F4" stroke-width="0.8" opacity="0.12" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad1)" />
  <rect width="800" height="500" fill="url(#gridPattern1)" />

  <!-- Cyber network nodes & connections in background -->
  <g stroke="#03A9F4" stroke-width="1.5" opacity="0.25">
    <line x1="120" y1="120" x2="250" y2="80" />
    <line x1="250" y1="80" x2="400" y2="130" />
    <line x1="400" y1="130" x2="550" y2="90" />
    <line x1="550" y1="90" x2="680" y2="150" />
    <line x1="150" y1="360" x2="280" y2="400" />
    <line x1="520" y1="410" x2="660" y2="350" />
  </g>
  <g fill="#03A9F4" opacity="0.4">
    <circle cx="120" cy="120" r="4" />
    <circle cx="250" cy="80" r="5" />
    <circle cx="550" cy="90" r="4" />
    <circle cx="680" cy="150" r="5" />
    <circle cx="150" cy="360" r="4" />
    <circle cx="280" cy="400" r="5" />
    <circle cx="520" cy="410" r="4" />
    <circle cx="660" cy="350" r="5" />
  </g>

  <!-- Presentation Stage & Screen Platform -->
  <rect x="220" y="70" width="360" height="230" rx="12" fill="#0d1b2a" stroke="#03A9F4" stroke-width="2.5" opacity="0.9" />
  <!-- Display inner glow -->
  <rect x="230" y="80" width="340" height="210" rx="8" fill="#070d18" />
  
  <!-- Content on screen: Cyber Shield & Security Lock -->
  <!-- Glowing radar circles -->
  <circle cx="400" cy="180" r="70" fill="none" stroke="#03A9F4" stroke-width="1" opacity="0.3" stroke-dasharray="4,4" />
  <circle cx="400" cy="180" r="50" fill="none" stroke="#C40000" stroke-width="1.5" opacity="0.4" />
  
  <!-- Central Shield -->
  <path d="M400 130 L445 150 V185 C445 215 400 235 400 235 C400 235 355 215 355 185 V150 Z" fill="url(#shieldGrad)" opacity="0.85" stroke="#FFFFFF" stroke-width="2" />
  <!-- Keyhole icon inside shield -->
  <circle cx="400" cy="172" r="7" fill="#FFFFFF" />
  <polygon points="396,174 404,174 406,195 394,195" fill="#FFFFFF" />

  <!-- Podium / Speaker -->
  <path d="M190 280 L230 280 L220 370 L180 370 Z" fill="#1b263b" stroke="#03A9F4" stroke-width="1" />
  <circle cx="205" cy="245" r="14" fill="#C40000" />
  <path d="M190 278 C190 262 220 262 220 278 Z" fill="#2d3748" />

  <!-- Audience Silhouettes in front of presentation -->
  <g fill="#0e1726" opacity="0.95">
    <!-- Audience row -->
    <circle cx="300" cy="355" r="16" />
    <path d="M275 395 C275 375 325 375 325 395 Z" />
    
    <circle cx="360" cy="350" r="17" fill="#14213d" />
    <path d="M333 395 C333 372 387 372 387 395 Z" fill="#14213d" />

    <circle cx="430" cy="350" r="17" fill="#14213d" />
    <path d="M403 395 C403 372 457 372 457 395 Z" fill="#14213d" />

    <circle cx="490" cy="355" r="16" />
    <path d="M465 395 C465 375 515 375 515 395 Z" />
  </g>

  <!-- Banner label badge -->
  <rect x="250" y="420" width="300" height="42" rx="21" fill="#0B1220" stroke="#C40000" stroke-width="2" />
  <text x="400" y="446" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1">
    SOSIALISASI KEAMANAN INFORMASI
  </text>
  <circle cx="270" cy="441" r="5" fill="#03A9F4" />
</svg>
